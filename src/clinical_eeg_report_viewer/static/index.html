<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>私有长程 EEG 报告浏览</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">DE-IDENTIFIED · READ ONLY</p>
      <h1>私有长程 EEG 报告浏览</h1>
      <p class="subtitle">冻结的 EEG-only AI 草稿、独立研究性头皮候选与医生结构化标签</p>
    </div>
    <div class="lock">只读发布包</div>
  </header>

  <main>
    <section class="boundary" aria-label="使用边界">
      <strong>边界说明</strong>
      <span>研究性候选不覆盖资格化脑电印象；医生标签未参与粗筛、事件选择、候选排序、事实生成或 LLM。不展示姓名、原始路径、Excel 自由文本或 EDF annotation。</span>
    </section>

    <section id="summary" class="summary" aria-label="数据概览"></section>

    <section class="workspace">
      <div class="catalog">
        <div class="filters" aria-label="筛选">
          <label class="search-label">
            <span>搜索</span>
            <input id="search" type="search" placeholder="recording_id / subject_id" autocomplete="off">
          </label>
          <label>
            <span>报告状态</span>
            <select id="status-filter"><option value="">全部</option></select>
          </label>
          <label>
            <span>医生标签</span>
            <select id="label-filter">
              <option value="">全部</option>
              <option value="available">有标签</option>
              <option value="not_available">无可用标签</option>
              <option value="ambiguous_mapping">映射歧义（闭锁）</option>
              <option value="source_conflict">来源冲突（闭锁）</option>
            </select>
          </label>
          <label>
            <span>定位一致性</span>
            <select id="consistency-filter">
              <option value="">全部</option>
              <option value="match">一致</option>
              <option value="partial_match">部分一致</option>
              <option value="mismatch">不一致</option>
              <option value="not_available">不可评价</option>
            </select>
          </label>
        </div>

        <div class="table-meta"><span id="result-count">加载中…</span></div>
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>recording_id</th>
                <th>subject_id</th>
                <th>状态</th>
                <th>事件</th>
                <th>研究性头皮候选</th>
                <th>医生标签</th>
                <th>定位一致性</th>
              </tr>
            </thead>
            <tbody id="records"></tbody>
          </table>
        </div>
      </div>

      <aside id="detail" class="detail empty" aria-live="polite">
        <div class="empty-state">
          <div class="empty-icon">EEG</div>
          <h2>选择一条记录</h2>
          <p>查看研究性头皮候选、冻结报告正文、医生标签、一致性评价及波形证据。</p>
        </div>
      </aside>
    </section>
  </main>

  <template id="metric-template">
    <article class="metric"><strong></strong><span></span></article>
  </template>
  <script src="app.js"></script>
</body>
</html>
